<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CISO RegBro</title>
  <link rel="icon" type="image/png" href="ciso.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="search-bar">
    <button
      id="mobileNavToggle"
      type="button"
      class="mobile-nav-toggle"
      aria-expanded="false"
      aria-controls="sidePanel"
      aria-label="Toggle regulation navigation"
    >
      <svg class="mobile-nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <span class="mobile-nav-label">Browse</span>
    </button>
    <img src="ciso.png" alt="" class="brand-logo" />
    <a href="https://knowledge.deutsche-boerse.de/spaces/ICTR/pages/833193286/RegBro+-+Regulatory+Browser" target="_blank" rel="noopener" style="text-decoration:none;" onmouseover="this.style.textDecoration=`underline`" onmouseout="this.style.textDecoration=`none`">
      <span class="brand-name"><span class="brand-prefix">CISO</span>Reg<span class="brand-name-accent">Bro</span></span>
    </a>
    <span class="brand-divider" aria-hidden="true"></span>
    <div class="search-wrapper">
      <div id="activeFilterPills" class="active-filter-pills" hidden aria-label="Active tag filters"></div>
      <div class="search-input-shell">
        <label for="searchInput" class="sr-only">Search</label>
        <input id="searchInput" type="search" placeholder="Search articles or keywords..." autocomplete="off" />
        <kbd id="searchShortcutHint" class="search-shortcut-hint" aria-hidden="true" title="Press / or Ctrl+K to search">/</kbd>
      </div>
      <div id="searchMatchStepper" class="search-match-stepper" hidden role="group" aria-label="In-page search matches">
        <span id="searchMatchCount" class="search-match-count">0 / 0</span>
        <button id="searchPrevMatch" type="button" class="search-step-button" title="Previous match (Shift+Enter)" aria-label="Previous search match">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
        <button id="searchNextMatch" type="button" class="search-step-button" title="Next match (Enter)" aria-label="Next search match">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>
      <div class="tag-filter-control">
        <button
          id="tagFilterButton"
          type="button"
          class="tag-filter-button"
          aria-expanded="false"
          aria-haspopup="dialog"
          aria-controls="tagFilterPopover"
        >
          <svg class="tag-filter-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
            <line x1="7" y1="7" x2="7.01" y2="7"></line>
          </svg>
          <span class="tag-filter-label">Tags</span>
          <span id="tagFilterCount" class="tag-filter-count" hidden>0</span>
        </button>
        <div id="tagFilterPopover" class="tag-filter-popover" role="dialog" aria-label="Filter regulations by tag" hidden></div>
      </div>
    </div>
    <img src="dbg_logo.svg" alt="Deutsche Börse Group" class="dbg-logo" />
  </div>

  <div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop" hidden aria-hidden="true"></div>

  <main class="page-content">
    <div class="layout">
      <aside id="sidePanel" class="side-panel" aria-label="Article navigation">
        <div class="side-panel-inner">
          <div class="mobile-drawer-header">
            <span class="mobile-drawer-title">Regulations</span>
            <button id="mobileDrawerClose" type="button" class="mobile-drawer-close" aria-label="Close navigation">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="side-panel-toolbar">
            <p id="listMessage" class="list-message"></p>
            <button type="button" id="collapseAllButton" class="collapse-all-button" hidden>
              <span class="collapse-all-icon" aria-hidden="true"></span>
              Collapse
            </button>
          </div>
          <nav class="article-list" aria-label="Articles">
            <ul id="articleList"></ul>
          </nav>
        </div>
      </aside>

      <section class="article-content">
        <div id="stickyContextBar" class="sticky-context-bar" hidden aria-hidden="true">
          <div id="stickyContextTrail" class="sticky-context-trail"></div>
          <div id="stickyContextActions" class="sticky-context-actions"></div>
        </div>
        <div class="reading-sheet">
          <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
          <header id="articleHeader" class="article-header">
            <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
            <div class="article-number-row">
              <span id="articleNumber" class="article-number-chip"></span>
            </div>
            <h2 id="articleTitle" class="article-title" tabindex="-1"></h2>
            <p id="articleSubtitle" class="article-subtitle"></p>
            <div id="actDossierMeta" class="act-dossier-meta" hidden></div>
            <div id="actTopicTags" class="act-topic-tags" hidden></div>
            <div id="legalEntityApplicability" class="legal-entity-applicability" hidden></div>
          </header>
          <div id="paragraphsContainer" class="paragraphs"></div>
          <nav class="article-navigation" aria-label="Article pagination">
            <button id="prevArticle" type="button" class="nav-button nav-button-prev" aria-label="View previous article">Previous</button>
            <button id="nextArticle" type="button" class="nav-button nav-button-next" aria-label="View next article">Next</button>
          </nav>
        </div>
      </section>
    </div>
  </main>

  <button id="scrollTopButton" type="button" class="scroll-top-button" hidden aria-label="Scroll back to top" title="Back to top">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    <span>Top</span>
  </button>

  <div id="copyToast" class="copy-toast" role="status" aria-live="polite" hidden></div>

  <footer class="page-footer">
    <p>Data sourced from consolidated legal texts published on <a href="https://eur-lex.europa.eu" target="_blank">EUR-Lex</a>.<span class="footer-version">v0.1</span></p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
